name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.4)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW_VER#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Target version: $VERSION (tag: v$VERSION)"

      - name: Sync versions in monorepo
        run: node scripts/sync-version.mjs ${{ steps.get_version.outputs.version }}

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Pack CLI package
        run: |
          rm -f packages/cli/*.tgz
          pnpm pack:cli

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: |
            packages/cli/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        if: env.NPM_TOKEN != ''
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if npm view "schema-memory@$VERSION" version > /dev/null 2>&1; then
            echo "⚠️ schema-memory@$VERSION is already published to npm. Skipping publish."
          else
            npm publish packages/cli/*.tgz --access public
          fi

      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json apps/*/package.json pnpm-lock.yaml
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.get_version.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          else
            echo "No version changes to commit back to main."
          fi
